<script>
/* fogos de coração (ficam atrás das flores) */
(function(){
  const cv=document.getElementById('fx'),ctx=cv.getContext('2d');
  let W,H,dpr,run=false;
  function size(){dpr=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
  addEventListener('resize',size);size();
  const rockets=[],parts=[],flashes=[];
  const PAL=[[[255,120,170],[255,226,236]],[[255,92,142],[255,182,206]],[[255,172,202],[255,255,255]],[[255,206,142],[255,246,226]],[[222,172,255],[255,216,240]]];
  const rr=(a,b)=>a+Math.random()*(b-a);
  function launch(o){
    o=o||{};const x=o.x!=null?o.x:W*rr(.15,.85);
    rockets.push({x,sx:x,y:H+8,ty:o.y!=null?o.y:H*rr(.16,.42),t:0,dur:rr(55,72),drift:rr(-22,22),size:o.size||rr(.85,1.2),
      pal:PAL[Math.random()*PAL.length|0],trail:[]});
    kick();
  }
  function heart(x,y,sz,pal){
    flashes.push({x,y,life:1});
    const S=Math.min(1.6,Math.max(.7,Math.min(W,H)/520))*sz;
    const ring=(n,k,col,dec)=>{
      for(let i=0;i<n;i++){
        const t=i/n*Math.PI*2,j=1+(Math.random()-.5)*.05;
        const vx=16*Math.pow(Math.sin(t),3),vy=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
        parts.push({x,y,vx:vx*.2*S*k*j,vy:vy*.2*S*k*j,drag:.972,g:.01,dec,life:1,c:col,s:rr(1.3,2.2)});
      }
    };
    ring(92,1,pal[0],.0085);
    ring(46,.55,pal[1],.0095);
  }
  function frame(){
    ctx.globalCompositeOperation='destination-out';
    ctx.fillStyle='rgba(0,0,0,.17)';ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation='lighter';
    for(let i=rockets.length-1;i>=0;i--){
      const r=rockets[i];r.t++;const p=Math.min(1,r.t/r.dur),e=1-Math.pow(1-p,2.2);
      r.x=r.sx+r.drift*e;r.y=H+8+(r.ty-H-8)*e;
      r.trail.push([r.x,r.y]);if(r.trail.length>12)r.trail.shift();
      for(let k=1;k<r.trail.length;k++){
        ctx.strokeStyle='rgba(255,225,235,'+(k/r.trail.length*.55)+')';ctx.lineWidth=1.6*k/r.trail.length+.4;
        ctx.beginPath();ctx.moveTo(r.trail[k-1][0],r.trail[k-1][1]);ctx.lineTo(r.trail[k][0],r.trail[k][1]);ctx.stroke();
      }
      if(p>=1){heart(r.x,r.y,r.size,r.pal);rockets.splice(i,1)}
    }
    for(let i=flashes.length-1;i>=0;i--){
      const f=flashes[i];f.life-=.07;if(f.life<=0){flashes.splice(i,1);continue}
      const g=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,90*(1.3-f.life));
      g.addColorStop(0,'rgba(255,225,238,'+(f.life*.35)+')');g.addColorStop(1,'rgba(255,225,238,0)');
      ctx.fillStyle=g;ctx.fillRect(f.x-100,f.y-100,200,200);
    }
    for(let i=parts.length-1;i>=0;i--){
      const p=parts[i];
      p.x+=p.vx;p.y+=p.vy;p.vx*=p.drag;p.vy=p.vy*p.drag+p.g;p.life-=p.dec;
      if(p.life<=0){parts.splice(i,1);continue}
      const a=p.life<.35?p.life*(.55+Math.random()*.45)*2.2:Math.min(1,p.life*1.4);
      ctx.fillStyle='rgba('+p.c[0]+','+p.c[1]+','+p.c[2]+','+a+')';
      ctx.beginPath();ctx.arc(p.x,p.y,p.s*(.5+p.life*.5),0,6.283);ctx.fill();
    }
    if(!rockets.length&&!parts.length&&!flashes.length){ctx.clearRect(0,0,W,H);run=false;return}
    requestAnimationFrame(frame);
  }
  function kick(){if(!run){run=true;requestAnimationFrame(frame)}}
  function show(){
    const N=12;
    for(let i=0;i<N;i++){
      const last=i===N-1;
      setTimeout(()=>launch({x:last?W*.5:W*(.14+.72*((i*.618)%1)),y:last?H*.3:undefined,size:last?1.6:(i%2?.85:1.15)}),i*650);
    }
  }
  addEventListener('message',e=>{
    const d=e.data||{};
    if(d.type==='fire')show();
    else if(d.type==='tap')launch({x:d.x,y:d.y});
  });
})();
</script>
